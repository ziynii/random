async function copyCode(buttonId,sourceId,label){
 const button=document.getElementById(buttonId);
 const field=document.getElementById(sourceId);
 const status=document.getElementById('status');
 const value=field.value;
 try{
  if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');
  await navigator.clipboard.writeText(value);
  status.textContent=label+' 코드가 복사됐어요!';
  button.textContent='복사 완료!';
 }catch(e){
  field.focus();field.select();
  let success=false;
  try{success=document.execCommand('copy')}catch(e){}
  if(success){status.textContent=label+' 코드가 복사됐어요!';button.textContent='복사 완료!';}
  else{status.textContent='복사가 제한되어 코드를 선택했어요. 직접 복사해 주세요.';button.textContent='코드 선택됨';}
 }
 setTimeout(()=>{button.textContent=label+' 복사'},1800);
}
document.getElementById('copy-bookmarklet').addEventListener('click',()=>copyCode('copy-bookmarklet','bookmarklet-source','북마클릿'));
document.getElementById('copy-userscript').addEventListener('click',()=>copyCode('copy-userscript','userscript-source','유저스크립트'));
</script></body></html>
